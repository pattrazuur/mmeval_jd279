[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pattrazuur-mmeval_jd279"
version = "0.1.0"
description = "把候选项映射到类别上，算出多模态评测工程师·梯度累积与有效批量的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "pattrazuur" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://pattrazuur.github.io"
Repository = "https://github.com/pattrazuur/mmeval_jd279"
Issues = "https://github.com/pattrazuur/mmeval_jd279/issues"

[project.scripts]
mmeval_jd279 = "mmeval_jd279:main"

[tool.setuptools]
py-modules = ["mmeval_jd279"]
